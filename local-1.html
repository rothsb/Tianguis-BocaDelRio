<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tianguis Digital - Plan Normal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      /* Color del borde/aro del logo: cambia solo esta variable para ajustarlo */
      --avatar-border-color: #ffffff;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #faf8f5;
      color: #2c2c2c;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .plan-card-container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      border: 1px solid #f0e6f6;
    }

    /* Foto de fondo/portada detrás del logo (antes era solo un degradado gris) */
    .card-header-bg {
      height: 90px;
      background-color: #d7ccc8; /* respaldo si no hay foto de portada */
      background-size: cover;
      background-position: center;
    }

    .card-avatar-wrap {
      display: flex;
      justify-content: center;
      margin-top: -35px;
    }

    .card-avatar {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 4px solid var(--avatar-border-color);
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .card-body {
      padding: 15px 20px 20px;
      text-align: center;
    }

    /* Antes: una sola etiqueta "Plan Normal" visible.
       Ahora: clasificaciones/categorías del negocio, en el exterior (mapa) e interior (tarjeta). */
    .category-tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .category-tag {
      background: #efebe9;
      color: #4e342e;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #333;
      margin: 8px 0 6px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 15px;
    }

    /* Grid de fotos: se ajusta solo según cuántas fotos haya (máximo 5) */
    .normal-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .normal-thumb {
      background: #f5f5f5;
      height: 75px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    /* La primera foto siempre ocupa el ancho completo (foto principal del local) */
    .normal-thumb.wide {
      grid-column: span 2;
      height: 90px;
    }

    /* Si sobra 1 foto suelta en la última fila, que también sea ancha */
    .normal-thumb.solo {
      grid-column: span 2;
    }

    .normal-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .footer-info {
      background: #fafafa;
      color: #666;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    /* Lightbox: al hacer clic en una foto, se ve completa */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .lightbox-overlay.active {
      display: flex;
    }

    .lightbox-overlay img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="plan-card-container">
    <!-- data-plan queda en el código como referencia interna; no se muestra al usuario -->
    <div class="card-header-bg" id="headerBg"></div>
    <div class="card-avatar-wrap">
      <img src="https://res.cloudinary.com/demo/image/upload/sample.jpg" alt="Avatar" class="card-avatar">
    </div>
    <div class="card-body" data-plan="normal">
      <div class="category-tags" id="categoryTags"></div>
      <h2 class="card-title">Tienda de Ropa Estándar</h2>
      <p class="card-desc">Espacio esencial en el tianguis con tus productos principales y datos básicos.</p>

      <div class="normal-grid" id="photoGrid"></div>

      <div class="footer-info">
        <i class="far fa-clock"></i> Horario: Sáb - Dom 10:00 - 17:00
      </div>
    </div>
  </div>

  <!-- Lightbox para ver las fotos completas -->
  <div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img src="" alt="Foto completa" id="lightboxImg">
  </div>

  <script>
    // ---- DATOS DE EJEMPLO (esto vendrá de shopsData en producción) ----

    // Foto de portada: va detrás del logo, en el fondo gris
    const coverPhotoUrl = "https://res.cloudinary.com/demo/image/upload/c_fill,w_800,h_300/landscape.jpg";

    // Clasificaciones/categorías del negocio (se muestran en vez de "Plan Normal")
    const categories = ["Ropa", "Casual"];

    // Fotos de producto/local: máximo 5 para el Plan Normal.
    // Si el comerciante sube menos de 5, el grid se ajusta solo.
    const productPhotos = [
      "https://res.cloudinary.com/demo/image/upload/sample.jpg",
      "https://res.cloudinary.com/demo/image/upload/c_fill,w_200,h_150/ar_4:3/lady.jpg",
      "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600&q=80",
      "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=600&q=80",
      "https://res.cloudinary.com/demo/image/upload/sample.jpg",
      // agrega hasta 2 fotos más aquí (máximo 5 en total)
    ];

    // ---- RENDER ----

    // Foto de portada detrás del logo
    document.getElementById('headerBg').style.backgroundImage = `url('${coverPhotoUrl}')`;

    // Clasificaciones (exterior/interior usan esta misma lista de categorías)
    const tagsContainer = document.getElementById('categoryTags');
    categories.forEach(cat => {
      const tag = document.createElement('span');
      tag.className = 'category-tag';
      tag.textContent = cat;
      tagsContainer.appendChild(tag);
    });

    // Grid de fotos (máximo 5, ajustado a la cantidad real)
    const MAX_PHOTOS = 5;
    const photos = productPhotos.slice(0, MAX_PHOTOS);
    const grid = document.getElementById('photoGrid');

    photos.forEach((url, index) => {
      const thumb = document.createElement('div');
      thumb.className = 'normal-thumb';

      // La primera foto siempre es ancha (foto principal)
      if (index === 0) {
        thumb.classList.add('wide');
      }
      // Si es la última foto y sobra sola en su fila (cantidad par de fotos), que sea ancha
      if (index === photos.length - 1 && index !== 0 && photos.length % 2 === 0) {
        thumb.classList.add('solo');
      }

      const img = document.createElement('img');
      img.src = url;
      img.alt = 'Foto del local';
      img.addEventListener('click', () => openLightbox(url));

      thumb.appendChild(img);
      grid.appendChild(thumb);
    });

    // Lightbox: click en una foto la muestra completa
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function openLightbox(url) {
      lightboxImg.src = url;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
  </script>

</body>
</html>
